name: wf-cd-production
on:
  push:
    branches:
      - develop
jobs:
  upload-job-production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          ref:"${{github.ref}}"
      - name: Build Static Wesbite With Parcel
        run: npx parcel build "./src/index.html" --dist-dir "./dist" --public-url "./"
      - name:  Upload Build Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"
          name: "build-artifact-production"
  deploy-job-production:
    needs: "upload-job-production"
    runs-on: ubuntu-latest
    environment:
      name: "production-env"
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Display Build Artifacts on GH Pages
        uses: actions/deploy-pages@v4
        with:
          artifact_name: "build-artifact-production"
          token: "${{github.token}}"

    






